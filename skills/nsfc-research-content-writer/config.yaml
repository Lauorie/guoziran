# ================================
# nsfc-research-content-writer 默认配置
# ================================

skill_info:
  name: nsfc-research-content-writer
  version: 1.1.0
  # template_year: 移除年份限制，使技能适用于不同年份的 NSFC 模板
  description: NSFC 标书正文“（二）研究内容”写作/重构，并同步编排“特色与创新”“年度研究计划”（按研究期限分年），输出 2.1/2.2/2.3 三份 extraTex 文件
  category: writing
  author: "Bensz Conan"

parameters:
  project_root:
    type: string
    required: true
    description: 项目根目录（如 projects/NSFC_Young 或你的标书项目路径）
  output_mode:
    type: string
    required: false
    default: apply
    allowed_values: [preview, apply]

targets:
  research_content_tex: extraTex/2.1.研究内容.tex
  innovation_tex: extraTex/2.2.特色与创新.tex
  yearly_plan_tex: extraTex/2.3.年度研究计划.tex

guardrails:
  allowed_write_files:
    - extraTex/2.1.研究内容.tex
    - extraTex/2.2.特色与创新.tex
    - extraTex/2.3.年度研究计划.tex
  forbidden_write_files:
    - main.tex
    - extraTex/@config.tex
  forbidden_write_globs:
    - "**/*.cls"
    - "**/*.sty"

quality_contract:
  research_content_must_cover:
    - 研究问题与总体目标
    - 3–4 个可检验子目标（指标/对照/数据来源）
    - 研究内容与任务分解（对齐子目标）
    - 技术路线与验证口径（防泄漏/对照/消融/统计）
  innovation_must_be:
    - 可理解（评审能看懂）
    - 可对照（相对坐标系）
    - 可验证（至少有指标或验证实验）
  yearly_plan_must_include:
    - 按研究期限分年任务（不跨年）
    - 里程碑与可交付成果（每年都有）

yearly_plan:
  # 按项目类型中的关键词定研究期限（年）；按顺序匹配，先命中先用。匹配不到时用 default_years，并提示记入 assumptions.md。
  duration_by_keyword:
    - [重点, 5]
    - [面上, 4]
    - [地区, 4]
    - [青年, 3]
  default_years: 3
  max_years: 5

# scripts/check_project_outputs.py 的轻量自检参数（可选覆盖默认值）
checks:
  # 绝对化措辞：通常建议避免；脚本可扫描并给出 WARN/ERROR（见 --fail-on-risk-phrases）
  # 只按下列短语匹配；单独的「首次」（如「首次测试前」）不报。
  risk_phrases:
    - 首次提出
    - 首次发现
    - 首次实现
    - 首次揭示
    - 首次构建
    - 首次建立
    - 国内首次
    - 国际首次
    - 世界首次
    - 领先
    - 填补空白
    - 突破性
    - 国际领先
    - 世界领先
  # 含 S+数字、但不是内部子目标编号的专业写法；S 编号泄漏检查跳过这些写法（误报时把写法加在这里）。
  # 紧跟在字母、数字或连字符后的 S+数字（如 L5–S1 中的 S1）本来就不算编号。
  allowed_s_tokens:
    - "L5-S1"
    - "L5–S1"
    - "S100"
    - "S100β"
    - "S1P"
    - "S1 受体"
    - "S1受体"
